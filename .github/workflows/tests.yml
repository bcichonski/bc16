name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # nightly full e2e of every area (selector returns all areas for an empty base)
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # PR runs cancel older runs of the same ref; each master push has its own group, so it is never cancelled or replaced while pending
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          # the release suite reads the legacy release commits from history
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Console commands run from outside the checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          bc64 --help < /dev/null
          bc81asmc --help < /dev/null
          bcc --help < /dev/null
          ftool createbdd ci-check.bdd < /dev/null
          test -s ci-check.bdd

      - name: Unit tests
        run: python run_tests.py --group unit < /dev/null

      - name: Code size (3.14 only, informational)
        if: matrix.python-version == '3.14'
        continue-on-error: true
        run: python scripts/code_size.py < /dev/null

      - name: Guard (tracked files, generated files, no cpudebug.log)
        if: always()
        shell: bash
        run: |
          status=0
          if [ -n "$(git ls-files -i -c --exclude-standard)" ]; then
            echo "::error::tracked files match .gitignore (git rm --cached them)"
            git ls-files -i -c --exclude-standard
            status=1
          fi
          # a tracked X.basm beside a tracked X.b is compiler output and must not be committed
          while IFS= read -r basm; do
            if git ls-files --error-unmatch -- "${basm%.basm}.b" > /dev/null 2>&1; then
              echo "::error::${basm} is generated from ${basm%.basm}.b and must not be tracked"
              status=1
            fi
          done < <(git ls-files '*.basm')
          if [ -n "$(find . -name cpudebug.log -print)" ]; then
            echo "::error::cpudebug.log found in the checkout"
            find . -name cpudebug.log -print
            status=1
          fi
          exit "$status"

  # pull requests: happy-path e2e only
  e2e-happy:
    if: github.event_name == 'pull_request'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: E2E tests (happy path)
        run: python run_tests.py --group e2e --tier happy < /dev/null

      - name: Guard (the build and tests leave the checkout clean)
        if: always()
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the build or the tests left tracked/untracked changes, so an output is not ignored"
            git status --porcelain
            exit 1
          fi

      - name: Regenerate goldens and collect patch
        if: failure()
        shell: bash
        run: |
          python run_tests.py --group e2e --tier happy --no-build --update-golden < /dev/null || true
          git diff --binary src/bc64/testdata/ > "$RUNNER_TEMP/testdata.patch" || true
          ls -l "$RUNNER_TEMP/testdata.patch"

      - name: Upload golden patch and testdata
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-golden-diff-happy
          path: |
            ${{ runner.temp }}/testdata.patch
            src/bc64/testdata/
          if-no-files-found: warn

      - name: Guard (no cpudebug.log)
        if: always()
        shell: bash
        run: |
          status=0
          if [ -n "$(find . -name cpudebug.log -print)" ]; then
            echo "::error::cpudebug.log found in the checkout"
            find . -name cpudebug.log -print
            status=1
          fi
          exit "$status"

  # pushes to master, nightly and manual runs: pick the areas the change can affect (every area on nightly and manual runs)
  e2e-areas:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      areas: ${{ steps.select.outputs.areas }}
    steps:
      - uses: actions/checkout@v5
        with:
          # the selector diffs against the previous head of the branch
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Select e2e areas
        id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          areas="$(python3 src/tests/e2e_areas.py changed --base "$BASE_SHA" --head "$HEAD_SHA" < /dev/null)"
          echo "areas=$areas" >> "$GITHUB_OUTPUT"
          echo "e2e areas: \`$areas\`" >> "$GITHUB_STEP_SUMMARY"

  # pushes to master, nightly and manual runs: full e2e, one job per selected area
  e2e:
    if: github.event_name != 'pull_request' && needs.e2e-areas.outputs.areas != '' && needs.e2e-areas.outputs.areas != '[]'
    needs: [unit, e2e-areas]
    name: e2e (${{ matrix.area }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.e2e-areas.outputs.areas) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: E2E tests
        env:
          AREA: ${{ matrix.area }}
        run: python run_tests.py --group e2e --area "$AREA" < /dev/null

      - name: Guard (the build and tests leave the checkout clean)
        if: always()
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the build or the tests left tracked/untracked changes, so an output is not ignored"
            git status --porcelain
            exit 1
          fi

      - name: Regenerate goldens and collect patch
        if: failure()
        shell: bash
        env:
          AREA: ${{ matrix.area }}
        run: |
          python run_tests.py --group e2e --area "$AREA" --no-build --update-golden < /dev/null || true
          git diff --binary src/bc64/testdata/ > "$RUNNER_TEMP/testdata.patch" || true
          ls -l "$RUNNER_TEMP/testdata.patch"

      - name: Upload golden patch and testdata
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-golden-diff-${{ matrix.area }}
          path: |
            ${{ runner.temp }}/testdata.patch
            src/bc64/testdata/
          if-no-files-found: warn

      - name: Guard (no cpudebug.log)
        if: always()
        shell: bash
        run: |
          status=0
          if [ -n "$(find . -name cpudebug.log -print)" ]; then
            echo "::error::cpudebug.log found in the checkout"
            find . -name cpudebug.log -print
            status=1
          fi
          exit "$status"
