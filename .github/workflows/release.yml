name: release

# A pushed bc64-v* tag builds the bc64 zip and publishes it as a GitHub Release.
# workflow_dispatch does the same without publishing and uploads the zip as an artifact
# (GitHub only offers dispatch for workflows on the default branch).

on:
  push:
    tags: ["bc64-v*"]
  workflow_dispatch:
    inputs:
      name:
        description: zip name and root folder (no release is created)
        required: true
        default: bc64-dryrun

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ZIP_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # the release suite reads the legacy commits from history
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Build the ignored intermediates
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          ./buildos && ./buildtools && ./buildapps && ./makedisc
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the build changed or left tracked/untracked files, so an output is not ignored"
            git status --porcelain
            exit 1
          fi

      - name: Tests
        run: python run_tests.py --no-build < /dev/null

      - name: Build the zip and its notes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/make_release.py bc64 --tag "$ZIP_NAME" --out dist < /dev/null
          python scripts/make_release.py notes bc64 > dist/notes.md < /dev/null
          unzip -l "dist/$ZIP_NAME.zip"

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            dist/${{ env.ZIP_NAME }}.zip
            dist/notes.md
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/bc64-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.ref_name }}
          path: dist

      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "dist/$TAG.zip" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file dist/notes.md
